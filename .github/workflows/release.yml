name: Release

# Triggered when a release/YYYY.MM.NN branch is pushed.
# Full release pipeline: validate → full suite → version tag → GitHub Release.
#
# Gitflow release process:
#   1. Cut branch: git checkout -b release/2026.06.02 develop
#   2. Update version in pyproject.toml to YYYY.MM.NN
#   3. Push → this workflow runs
#   4. On merge to master → tag is created automatically

on:
  push:
    branches: ['release/**']
  pull_request:
    branches: [master]
    types: [closed]

# Python version is pinned via .python-version (3.11); uv resolves it
# automatically for every `uv sync` / `uv run` invocation below.

jobs:
  # ── Version Validation ────────────────────────────────────────────────────
  validate-version:
    name: Validate YYYY.MM.NN Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - name: Validate version format
        run: uv run bash scripts/version-check.sh

      - name: Validate branch name matches version
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          BRANCH="${{ github.ref_name }}"
          PKG_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          BRANCH_VERSION="${BRANCH#release/}"

          if [[ "$BRANCH_VERSION" != "$PKG_VERSION" ]]; then
            echo "❌ Branch name '$BRANCH' version '$BRANCH_VERSION' does not match pyproject.toml '$PKG_VERSION'"
            exit 1
          fi
          echo "✅ Branch version matches pyproject.toml: $PKG_VERSION"

      - id: get_version
        run: echo "version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

  # ── Full Release Suite ────────────────────────────────────────────────────
  full-suite:
    name: Full Release Suite
    runs-on: ubuntu-latest
    needs: validate-version
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - run: uv sync --extra dev --extra otel
      - run: uv run mypy --strict
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv build

      - name: AI Safety Gate (MANDATORY for release)
        run: uv run bash scripts/ai-safety-gate.sh --verbose

      - name: SDD Conformance (MANDATORY for release)
        run: uv run bash scripts/conformance-check.sh

      - name: Full test suite
        run: PYTHONPATH=src uv run pytest tests/ -v

      # NOTE: pip-audit has no `--audit-level`-style severity flag (unlike the
      # `npm audit --audit-level=high` this job replaces), so this gate fails
      # on ANY known vulnerability, including LOW/MEDIUM severity — not just
      # HIGH/CRITICAL as before. This is an intentional, documented tightening
      # of the dependency-audit gate, not an accidental behavior change.
      - name: Dependency audit (known vulnerabilities — fails on ANY severity, see note above)
        run: uv run --with pip-audit pip-audit

  # ── Release Artifact Build ────────────────────────────────────────────────
  build-release:
    name: Build Release Artifact
    runs-on: ubuntu-latest
    needs: [validate-version, full-suite]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - run: uv sync --extra dev --extra otel
      - name: Build sdist + wheel
        run: uv build

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ooagent-${{ needs.validate-version.outputs.version }}
          path: dist/*
          retention-days: 90

  # ── Create GitHub Release (on merge to master) ────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-version, build-release]
    if: github.event.pull_request.merged == true && github.base_ref == 'master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ooagent-${{ needs.validate-version.outputs.version }}
          path: dist/

      - name: Create git tag
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [[ -n "$PREV_TAG" ]]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --oneline --no-merges)
          else
            COMMITS=$(git log --oneline --no-merges | head -20)
          fi
          cat <<EOF > release-notes.md
          ## OOAgent v${VERSION}

          ### Changes
          \`\`\`
          ${COMMITS}
          \`\`\`

          ### AI Safety Gate
          All 13 AI disaster prevention guards passed before this release was cut.
          See \`scripts/ai-safety-gate.sh\` for details on each guard.

          ### Installation
          \`\`\`bash
          pip install ooagent==${VERSION}
          # or
          uv add ooagent==${VERSION}
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate-version.outputs.version }}
          name: OOAgent v${{ needs.validate-version.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Publish to npm ─────────────────────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: github-release
    if: github.event.pull_request.merged == true && github.base_ref == 'master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev --extra otel
      - run: uv build
      - run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
