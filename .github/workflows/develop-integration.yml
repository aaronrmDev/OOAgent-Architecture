name: Develop Integration

# Runs on every push to develop.
# Full integration suite: build → conformance → AI safety → coverage.
# Publishes nightly snapshot to GitHub Packages if all checks pass.

on:
  push:
    branches: [develop]

# Python version is pinned via .python-version (3.11); uv resolves it
# automatically for every `uv sync` / `uv run` invocation below.

jobs:
  # ── Full CI Core (re-run on develop push) ─────────────────────────────────
  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install
        run: uv sync --extra dev --extra otel

      - name: Type check
        run: uv run mypy --strict

      - name: Lint (ruff check)
        run: uv run ruff check

      - name: Format check (ruff format)
        run: uv run ruff format --check

      - name: Build
        run: uv build

  # ── AI Safety Gate ────────────────────────────────────────────────────────
  ai-safety:
    name: AI Safety Gate
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev --extra otel
      - run: uv run bash scripts/ai-safety-gate.sh --verbose

  # ── SDD Conformance ───────────────────────────────────────────────────────
  sdd:
    name: SDD Conformance
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev --extra otel
      - run: uv run bash scripts/conformance-check.sh

  # ── Integration Tests with StubLLMClient ─────────────────────────────────
  integration:
    name: Integration Tests (StubLLMClient)
    runs-on: ubuntu-latest
    needs: [ai-safety, sdd]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev --extra otel
      - name: Run tests
        run: PYTHONPATH=src uv run pytest tests/ -v

  # ── Nightly Snapshot to GitHub Packages ──────────────────────────────────
  snapshot:
    name: Publish Dev Snapshot
    runs-on: ubuntu-latest
    needs: integration
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - run: uv sync --extra dev --extra otel

      - name: Stamp snapshot version
        run: |
          PKG_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          SHORT_SHA=$(echo "${{ github.sha }}" | head -c 7)
          # PEP 440: the segment after ".dev" must be numeric-only, but a git
          # SHA is hex (contains a-f). Use a "+g<sha>" local version segment
          # instead — PEP 440 allows arbitrary alphanumerics after "+", and
          # this mirrors the convention setuptools_scm/hatch-vcs use for
          # dev builds off a git SHA (e.g. "2026.07.01+ga1b2c3d").
          SNAPSHOT_VERSION="${PKG_VERSION}+g${SHORT_SHA}"
          sed -i "s/^version = \".*\"/version = \"${SNAPSHOT_VERSION}\"/" pyproject.toml
          echo "Snapshot version: $SNAPSHOT_VERSION"

      - name: Build snapshot
        run: uv build

      - name: Validate build (dry-run — no registry publish configured)
        run: uv run --with twine twine check dist/*
