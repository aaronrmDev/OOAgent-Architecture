name: Develop Integration

# Runs on every push to develop.
# Full integration suite: build → conformance → AI safety → coverage.
# Publishes nightly snapshot to GitHub Packages if all checks pass.

on:
  push:
    branches: [develop]

env:
  NODE_VERSION: '22'

jobs:
  # ── Full CI Core (re-run on develop push) ─────────────────────────────────
  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ── AI Safety Gate ────────────────────────────────────────────────────────
  ai-safety:
    name: AI Safety Gate
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: bash scripts/ai-safety-gate.sh --verbose

  # ── SDD Conformance ───────────────────────────────────────────────────────
  sdd:
    name: SDD Conformance
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/conformance-check.sh

  # ── Integration Tests with StubLLMClient ─────────────────────────────────
  integration:
    name: Integration Tests (StubLLMClient)
    runs-on: ubuntu-latest
    needs: [ai-safety, sdd]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm test -- --passWithNoTests
        env:
          NODE_OPTIONS: --experimental-vm-modules

  # ── Nightly Snapshot to GitHub Packages ──────────────────────────────────
  snapshot:
    name: Publish Dev Snapshot
    runs-on: ubuntu-latest
    needs: integration
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@aaronrmdev'

      - run: npm ci
      - run: npm run build

      - name: Stamp snapshot version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(echo "${{ github.sha }}" | head -c 7)
          SNAPSHOT_VERSION="${PKG_VERSION}-dev.${SHORT_SHA}"
          npm version "$SNAPSHOT_VERSION" --no-git-tag-version
          echo "Snapshot version: $SNAPSHOT_VERSION"

      - name: Publish snapshot (dry-run on non-main)
        run: npm publish --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
