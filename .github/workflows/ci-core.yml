name: CI Core

# Runs on every push and PR to any branch.
# Enforces: TypeScript build, conformance tests, SDD static check, and AI Safety Guards.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-core-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── 1. Build ───────────────────────────────────────────────────────────────
  build:
    name: TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (strict)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run conformance tests
        run: node --test dist/testing/conformance/*.test.js

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 1

  # ── 2. Version Format ──────────────────────────────────────────────────────
  version:
    name: Version Format (YYYY.MM.NN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate version format
        run: bash scripts/version-check.sh

  # ── 3. SDD Conformance ─────────────────────────────────────────────────────
  sdd-conformance:
    name: SDD Conformance (§17 CLAUDE.md)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Check interface conformance tests
        run: bash scripts/conformance-check.sh

  # ── 4. AI Safety Gate ─────────────────────────────────────────────────────
  # Each of the 10 guards maps to documented AI disasters (2020-2026).
  # A failing guard BLOCKS the merge — it is not advisory.
  ai-safety-gate:
    name: AI Safety Gate (10 Disaster Guards)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run AI Safety Gate
        run: |
          chmod +x scripts/ai-safety-gate.sh
          bash scripts/ai-safety-gate.sh --verbose

      - name: Upload safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-safety-report-${{ github.sha }}
          path: |
            scripts/ai-safety-gate.sh
          retention-days: 30

  # ── 5. Secret Scanning ────────────────────────────────────────────────────
  # Guard 5 extension: GitHub's native secret scanning + gitleaks
  secret-scan:
    name: Secret Scan (Guard 5 — Data Exfiltration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 6. Dependency Audit ───────────────────────────────────────────────────
  # Guard 7: Supply chain — npm audit for HIGH/CRITICAL vulnerabilities
  dependency-audit:
    name: Dependency Audit (Guard 7 — Supply Chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: npm audit (HIGH+CRITICAL)
        run: npm audit --audit-level=high
