name: CI Core

# Runs on every push and PR to any branch.
# Enforces: Python build (uv), mypy --strict, ruff lint/format, conformance
# tests, SDD static check, and AI Safety Guards.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-core-${{ github.ref }}
  cancel-in-progress: true

# Python version is pinned via .python-version (3.11); uv resolves it
# automatically for every `uv sync` / `uv run` invocation below.

jobs:
  # ── 1. Build ───────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev --extra otel --extra mcp

      - name: Type check (strict)
        run: uv run mypy --strict

      - name: Lint (ruff check)
        run: uv run ruff check

      - name: Format check (ruff format)
        run: uv run ruff format --check

      - name: Build
        run: uv build

      - name: Run conformance tests
        run: PYTHONPATH=src uv run pytest tests/conformance/ -v

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 1

  # ── 2. Version Format ──────────────────────────────────────────────────────
  version:
    name: Version Format (YYYY.MM.NN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
      - name: Validate version format
        run: uv run bash scripts/version-check.sh

  # ── 3. SDD Conformance ─────────────────────────────────────────────────────
  sdd-conformance:
    name: SDD Conformance (§17 CLAUDE.md)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --extra dev --extra otel --extra mcp
      - name: Check interface conformance tests
        run: uv run bash scripts/conformance-check.sh

  # ── 4. AI Safety Gate ─────────────────────────────────────────────────────
  # Each of the 13 guards maps to documented AI disasters (2020-2026).
  # A failing guard BLOCKS the merge — it is not advisory.
  # NOTE: the job `name:` below intentionally still says "10 Disaster Guards"
  # even though scripts/ai-safety-gate.sh now has 13 guards — GitHub branch
  # protection matches required status checks by this exact displayed name,
  # so renaming it needs a deliberate, reviewed change to branch protection
  # settings, not a silent rename here.
  ai-safety-gate:
    name: AI Safety Gate (10 Disaster Guards)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev --extra otel --extra mcp

      - name: Run AI Safety Gate
        run: |
          chmod +x scripts/ai-safety-gate.sh
          uv run bash scripts/ai-safety-gate.sh --verbose

      - name: Upload safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-safety-report-${{ github.sha }}
          path: |
            scripts/ai-safety-gate.sh
          retention-days: 30

  # ── 5. Secret Scanning ────────────────────────────────────────────────────
  # Guard 5 extension: GitHub's native secret scanning + gitleaks
  secret-scan:
    name: Secret Scan (Guard 5 — Data Exfiltration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 6. Dependency Audit ───────────────────────────────────────────────────
  # Guard 7: Supply chain — pip-audit for known vulnerabilities
  dependency-audit:
    name: Dependency Audit (Guard 7 — Supply Chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --extra dev --extra otel --extra mcp
      # NOTE: pip-audit has no `--audit-level`-style severity flag (unlike the
      # `npm audit --audit-level=high` this job replaces), so this gate fails
      # on ANY known vulnerability, including LOW/MEDIUM severity — not just
      # HIGH/CRITICAL as before. This is an intentional, documented tightening
      # of the dependency-audit gate, not an accidental behavior change.
      - name: pip-audit (known vulnerabilities — fails on ANY severity, see note above)
        run: uv run --with pip-audit pip-audit
