name: Feature PR Gate

# Runs on pull requests targeting develop.
# Enforces Spec Driven Development: no interface change without a conformance
# test. Detects protocol drift in src/ooagent/core/protocols.py.

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

jobs:
  # ── SDD Protocol Drift Detection ──────────────────────────────────────────
  # If src/ooagent/core/protocols.py changed, ensure:
  #   a) The change is additive (minor bump) or breaking (major bump)
  #   b) CLAUDE.md §18 versioning rules are followed
  protocol-drift:
    name: SDD Protocol Drift Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for src/ooagent/core/protocols.py changes
        id: proto_changed
        run: |
          if git diff origin/develop...HEAD -- src/ooagent/core/protocols.py | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "⚠️  src/ooagent/core/protocols.py has changed — checking for conformance tests..."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ src/ooagent/core/protocols.py unchanged"
          fi

      - name: Verify conformance tests updated with protocol changes
        if: steps.proto_changed.outputs.changed == 'true'
        run: |
          TESTS_CHANGED=$(git diff origin/develop...HEAD -- tests/ | grep -c "^+" || echo "0")
          if [[ "$TESTS_CHANGED" -lt 5 ]]; then
            echo "❌ src/ooagent/core/protocols.py changed but tests/ has fewer than 5 new lines."
            echo "   Every interface change requires updated conformance tests (§17 CLAUDE.md)."
            exit 1
          fi
          echo "✅ tests/ updated alongside protocol changes ($TESTS_CHANGED new lines)"

      - name: Check version bump for breaking changes
        if: steps.proto_changed.outputs.changed == 'true'
        run: |
          # Detect removed public class/function definitions (breaking change)
          # → requires major version bump. Python has no `export` keyword, so
          # a removed top-level `class ` or `def ` in protocols.py is the
          # equivalent signal to the TS-era `^-export` check.
          REMOVED=$(git diff origin/develop...HEAD -- src/ooagent/core/protocols.py | grep -cE "^-(class |def )" || echo "0")
          if [[ "$REMOVED" -gt 0 ]]; then
            echo "⚠️  $REMOVED definition(s) removed from src/ooagent/core/protocols.py — this is a breaking change."
            echo "   Per §18 CLAUDE.md: breaking interface changes require a major version bump."
            echo "   Current pyproject.toml version must increment the year or month component."
          fi

  # ── Plugin Contribution Verification ──────────────────────────────────────
  # Every new plugin added in this PR must declare contributes() and on_dispose()
  plugin-contributions:
    name: Plugin Contribution Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check new plugins for required IPlugin interface
        run: |
          FAILURES=0
          NEW_PLUGIN_FILES=$(git diff origin/develop...HEAD --name-only | grep -E "^src/ooagent/plugins/[^/]+/__init__\.py$" || true)

          for plugin_file in $NEW_PLUGIN_FILES; do
            if [[ -f "$plugin_file" ]]; then
              if ! grep -q "def contributes" "$plugin_file"; then
                echo "❌ $plugin_file is missing contributes() — required by IPlugin interface"
                FAILURES=$((FAILURES + 1))
              fi
              if ! grep -q "def on_dispose" "$plugin_file"; then
                echo "❌ $plugin_file is missing on_dispose() — required by IPlugin interface"
                FAILURES=$((FAILURES + 1))
              fi
              if ! grep -q "plugin_id" "$plugin_file"; then
                echo "❌ $plugin_file is missing plugin_id — required by IPlugin interface"
                FAILURES=$((FAILURES + 1))
              fi
              if ! grep -q "version" "$plugin_file"; then
                echo "❌ $plugin_file is missing version — required by IPlugin interface"
                FAILURES=$((FAILURES + 1))
              fi
            fi
          done

          if [[ "$FAILURES" -gt 0 ]]; then
            exit 1
          fi
          echo "✅ All new plugins satisfy IPlugin interface requirements"

  # ── CONTEXT.md Requirement ────────────────────────────────────────────────
  # Every new IDomainContext implementation must ship a CONTEXT.md (§14)
  context-md:
    name: CONTEXT.md Requirement (§14 CLAUDE.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check new contexts for CONTEXT.md
        run: |
          FAILURES=0
          NEW_CONTEXT_DIRS=$(git diff origin/develop...HEAD --name-only \
            | grep "^src/ooagent/contexts/" | grep -v "null_context\.py\|__init__\.py" \
            | sed 's|/[^/]*$||' | sort -u || true)

          for ctx_dir in $NEW_CONTEXT_DIRS; do
            if [[ -d "$ctx_dir" ]] && [[ ! -f "${ctx_dir}/CONTEXT.md" ]]; then
              echo "❌ $ctx_dir is missing CONTEXT.md (§14 CLAUDE.md)"
              FAILURES=$((FAILURES + 1))
            fi
          done

          if [[ "$FAILURES" -gt 0 ]]; then
            exit 1
          fi
          echo "✅ All new domain contexts have CONTEXT.md"

  # ── PR Title SDD Format ───────────────────────────────────────────────────
  pr-title:
    name: PR Title Format
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$PR_TITLE" | grep -qE "^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: .{1,72}$"; then
            echo "✅ PR title follows Conventional Commits: $PR_TITLE"
          else
            echo "❌ PR title does not follow Conventional Commits format."
            echo "   Expected: <type>(<scope>): <description>"
            echo "   Types: feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert"
            echo "   Max description length: 72 chars"
            exit 1
          fi
