[project]
name = "ooagent"
version = "2026.07.03"
description = "Object-Oriented AI Agent Framework — backend-agnostic, domain-agnostic"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
mcp = [
    "mcp>=1.28",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "tzdata>=2024.1",
]

[project.scripts]
ooagent-mcp = "ooagent.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ooagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
files = ["src/ooagent", "tests", "examples"]

# Relaxed for tests/examples only: pytest fixture params (tmp_path, monkeypatch,
# capsys, ...) are not uniformly annotated by convention, and lightweight
# test-double classes (_FakeAgent, _CountingTool, ...) duck-type against the
# ABCs (IAgent, ITool) without nominally subclassing them, plus test assertion
# code narrows Optional/Union values mypy can't prove non-None/non-narrow by
# construction — none of this is sloppy test code, it's structural to the
# test-double and fixture patterns used throughout this suite.
[[tool.mypy.overrides]]
module = ["tests.*", "examples.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["arg-type", "union-attr", "index", "no-untyped-call", "list-item"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
